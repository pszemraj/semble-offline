name: GitHub Release wheels

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wheels:
    name: Build and test platform wheels
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yaml

  release:
    name: Publish immutable GitHub Release
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate release tag
        run: |
          expected="v$(python -c 'import runpy; print(runpy.run_path("src/semble/version.py")["__version__"])')"
          test "$GITHUB_REF_NAME" = "$expected"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Verify release payload
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          for wheel in dist/*.whl; do python scripts/verify_wheel.py "$wheel"; done
          cd dist
          sha256sum *.whl > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create, verify, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || {
              echo "Refusing to modify an already-published release" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Semble Offline $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS --clobber
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --check SHA256SUMS
          for wheel in *.whl; do python "$GITHUB_WORKSPACE/scripts/verify_wheel.py" "$wheel"; done
          gh release edit "$GITHUB_REF_NAME" --draft=false
