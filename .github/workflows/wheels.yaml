name: Platform wheels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: Build Linux x86_64 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build==1.5.0" "auditwheel==6.7.0"
      - name: Build reproducibly
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
          mkdir "$RUNNER_TEMP/source-one" "$RUNNER_TEMP/source-two"
          tar -xf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/source-one"
          tar -xf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/source-two"
          (cd "$RUNNER_TEMP/source-one" && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist-linux")
          (cd "$RUNNER_TEMP/source-two" && python -m build --wheel --outdir "$RUNNER_TEMP/linux-rebuild")
          cmp dist-linux/*.whl "$RUNNER_TEMP"/linux-rebuild/*.whl
      - name: Verify contents and compatibility
        run: python scripts/verify_wheel.py --check-linux-policy dist-linux/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-x86_64
          path: dist-linux/*.whl
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS arm64 wheel
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned build toolchains
        run: |
          python -m pip install "build==1.5.0" "delocate==0.13.0" "GitPython==3.1.52" "anyio==4.14.2" "typing-extensions==4.16.0"
          rustup toolchain install 1.91 --profile minimal
          npm install --prefix "$RUNNER_TEMP/tree-sitter-cli" tree-sitter-cli@0.26.8
          echo "$RUNNER_TEMP/tree-sitter-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build pinned grammar bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python scripts/build_grammar_bundle.py --platform macos-arm64 --output "$RUNNER_TEMP/macos-arm64-bundle"
      - name: Build reproducibly
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          SEMBLE_OFFLINE_BUNDLE_DIR: ${{ runner.temp }}/macos-arm64-bundle
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
          mkdir "$RUNNER_TEMP/source-one" "$RUNNER_TEMP/source-two"
          tar -xf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/source-one"
          tar -xf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/source-two"
          (cd "$RUNNER_TEMP/source-one" && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist-macos")
          (cd "$RUNNER_TEMP/source-two" && python -m build --wheel --outdir "$RUNNER_TEMP/macos-rebuild")
          cmp dist-macos/*.whl "$RUNNER_TEMP"/macos-rebuild/*.whl
      - name: Verify contents, architecture, and dependencies
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python scripts/verify_wheel.py dist-macos/*.whl
          delocate-listdeps --all dist-macos/*.whl
          delocate-wheel --require-archs arm64 --wheel-dir "$RUNNER_TEMP/delocated" dist-macos/*.whl
          python - "$RUNNER_TEMP/delocated" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path(sys.argv[1]).glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              vendored = [name for name in archive.namelist() if ".dylibs/" in name]
          if vendored:
              raise SystemExit(f"macOS wheel unexpectedly needs vendored libraries: {vendored}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-arm64
          path: dist-macos/*.whl
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  test-linux:
    name: Test Linux wheel on Python ${{ matrix.python-version }}
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: wheel
      - name: Install the built wheel
        run: |
          wheel="$(find "$PWD/wheel" -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[dev,mcp]"
          python -m pip install --force-reinstall --no-deps "$wheel"
          python -m pip check
          python -c 'import pathlib, semble; assert "site-packages" in str(pathlib.Path(semble.__file__).resolve())'
      - name: Run installed-package tests
        run: python -m pytest
      - name: Exercise every offline asset
        env:
          HF_HUB_OFFLINE: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: python -m semble doctor --full

  test-macos:
    name: Test macOS wheel on Python ${{ matrix.python-version }}
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-macos-arm64
          path: wheel
      - name: Install the built wheel
        run: |
          wheel="$(find "$PWD/wheel" -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[dev,mcp]"
          python -m pip install --force-reinstall --no-deps "$wheel"
          python -m pip check
          python -c 'import pathlib, semble; assert "site-packages" in str(pathlib.Path(semble.__file__).resolve())'
      - name: Run installed-package tests
        run: python -m pytest
      - name: Exercise every offline asset
        env:
          HF_HUB_OFFLINE: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: python -m semble doctor --full
