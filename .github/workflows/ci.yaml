name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Source tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[dev,mcp]"
      - name: Run tests
        run: python -m pytest
      - name: Exercise the offline runtime
        if: matrix.python-version == '3.12'
        env:
          HF_HUB_OFFLINE: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: python -m semble doctor --full

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install ".[dev,mcp]"
      - name: Lint
        run: |
          python -m ruff check src tests scripts setup.py
          python -m ruff format --check src tests scripts setup.py
          pydoclint src
      - name: Type check
        run: python -m mypy src

  wheels:
    name: Build and test platform wheels
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yaml

  success:
    name: CI success
    if: always()
    needs: [test, quality, wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.wheels.result }}" = "success"
